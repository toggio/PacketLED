sentence=Packet communication over bidirectional LEDs, inspired by Packet Radio.
paragraph=PacketLED lets two boards exchange data through a pair of ordinary LEDs placed face to face. There is no photodiode: each LED emits light to transmit, and is used as a light sensor to receive. One LED and one resistor per board are all you need. Tested up to 2.5 m at 1024 bit/s with clear, narrow-beam LEDs.
